<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logbook</title>
  <meta name="theme-color" content="#03381f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Logbook">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

</head>
<body>
  <main id="main"></main>
  <nav id="tabs">
    <a href="#/log" data-tab="log"><span>📖</span>Logbook</a>
    <a href="#/map" data-tab="map"><span>🗺️</span>Map</a>
    <button id="add" aria-label="Add">+</button>
    <a href="#/stats" data-tab="stats"><span>📈</span>Stats</a>
    <a href="#/ideas" data-tab="ideas"><span>💡</span>Ideas</a>
  </nav>
  <dialog id="sheet"></dialog>
  <div id="toast" role="status"></div>
  <span id="who" hidden></span>
  <script type="module" src="js/app.js"></script>

</html>
